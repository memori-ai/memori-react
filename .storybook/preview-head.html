<meta
  name="viewport"
  content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no, user-scalable=no, viewport-fit=cover"
/>
<style>
  /* Layout CHAT uses height: 100%. Without a sized host the widget collapses
     and the input sits at the top of the canvas with empty space below. */

  body {
    height: 100%;
    margin: 0;
  }

  #storybook-root,
  #root {
    height: 100%;
    min-height: 0;
    box-sizing: border-box;
  }
</style>
