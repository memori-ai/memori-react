enableImmutableInstalls: false

nodeLinker: node-modules

# lodash.pick has no patched release. Its only consumer, @react-three/drei@8
# (TransformControls), calls it with a hardcoded list of keys, so the
# prototype pollution via user-controlled paths is not reachable.
npmAuditIgnoreAdvisories:
  - "1106907" # GHSA-p6mc-m468-83gw

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-workspace-tools.cjs
    spec: "@yarnpkg/plugin-workspace-tools"
